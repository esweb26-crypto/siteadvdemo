<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none" role="img" aria-label="Serra Vasconcellos Advogados">
  <!-- Cartucho (emblema heráldico) -->
  <rect x="4" y="14" width="72" height="72" fill="none" stroke="#C9A961" stroke-width="1.5"/>
  <rect x="10" y="20" width="60" height="60" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>

  <!-- Monograma S + V sobrepostos -->
  <text x="14" y="66" font-family="'Sorts Mill Goudy', Georgia, 'Times New Roman', serif" font-size="46" font-weight="400" fill="currentColor" letter-spacing="-4">S</text>
  <text x="40" y="66" font-family="'Sorts Mill Goudy', Georgia, 'Times New Roman', serif" font-size="46" font-weight="400" fill="#C9A961" letter-spacing="-4">V</text>

  <!-- Divisor vertical -->
  <line x1="90" y1="22" x2="90" y2="78" stroke="#C9A961" stroke-width="1"/>

  <!-- Wordmark -->
  <text x="104" y="48" font-family="'Sorts Mill Goudy', Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="currentColor" letter-spacing="0.6">Serra Vasconcellos</text>

  <!-- Hairline rule -->
  <line x1="104" y1="58" x2="320" y2="58" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>

  <!-- Tagline -->
  <text x="104" y="75" font-family="'Rethink Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="500" fill="currentColor" letter-spacing="5">SOCIEDADE DE ADVOGADOS</text>
</svg>

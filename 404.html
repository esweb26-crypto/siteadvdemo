<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Página não encontrada &#8211; Serra Vasconcellos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/google-fonts.css">
<style>
  :root { --bg: #111111; --fg: #F4F4F4; --muted: #A8A8A8; --gold: #C9A961; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: 'Rethink Sans', Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 24px clamp(16px, 5vw, 80px); border-bottom: 1px solid rgba(255,255,255,0.06); }
  header img { display: block; width: 190px; height: auto; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px clamp(16px, 5vw, 80px);
    max-width: 880px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase;
    color: rgba(201,169,97,0.85); margin: 0 0 20px;
  }
  .eyebrow::before { content: "●"; font-size: 6px; color: var(--gold); }
  h1 {
    font-family: 'Sorts Mill Goudy', Georgia, serif; font-weight: 400;
    font-size: clamp(40px, 7vw, 76px); line-height: 1.05; letter-spacing: -0.02em;
    margin: 0 0 24px;
  }
  p { color: var(--muted); font-size: 18px; line-height: 1.65; margin: 0 0 40px; max-width: 34em; }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 18px 40px; border-radius: 50px; font-size: 16px; font-weight: 600;
    text-decoration: none; border: 1px solid var(--gold);
    transition: background-color 250ms ease, color 250ms ease;
  }
  .btn--fill { background: var(--gold); color: #111; }
  .btn--fill:hover { background: #d8bd7e; }
  .btn--line { color: var(--gold); }
  .btn--line:hover { background: var(--gold); color: #111; }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  footer { padding: 24px clamp(16px, 5vw, 80px); color: var(--muted); font-size: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <header>
    <a href="/"><img src="/assets/img/logo-sv.svg" alt="Serra Vasconcellos Advogados" width="190" height="62"></a>
  </header>
  <main>
    <span class="eyebrow">Erro 404</span>
    <h1>Esta página não existe ou mudou de endereço.</h1>
    <p>O link pode estar desatualizado. Volte para o início ou fale diretamente com um sócio — retornamos em até um dia útil.</p>
    <div class="actions">
      <a class="btn btn--fill" href="/">Voltar ao início</a>
      <a class="btn btn--line" href="/contato.html">Fale Conosco</a>
    </div>
  </main>
  <footer>&copy; 2026 Serra Vasconcellos Advogados Associados · Av. Rio Branco, 1 – Centro, Rio de Janeiro</footer>
</body>
</html>
